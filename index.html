#tulip{bottom:0;right:0;width:clamp(70px,13vw,260px)}
.screen{display:none;position:relative;z-index:1;min-height:100svh;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;text-align:center;padding:5rem 5vw 7rem}
.screen.on{display:flex}
.s2,.s3,.s4{padding-top:clamp(7rem,24vh,12rem)}
p{margin:0}
.lead{font-size:clamp(1.15rem,3.2vw,2.1rem);line-height:1.5;max-width:60rem}
.pesan{font-size:clamp(1.15rem,2.9vw,2rem);line-height:1.6;max-width:52rem}
.btn{font:inherit;font-size:clamp(1.1rem,2.4vw,1.7rem);width:min(90%,22rem);padding:.55rem 1rem;border:0;border-radius:999px;background:var(--cream);color:var(--ink);box-shadow:5px 6px 10px rgba(60,40,70,.3);cursor:pointer}
.btn:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#np{display:none;position:fixed;z-index:3;top:var(--pad);left:3.5vw;width:min(34vw,26rem);min-width:220px;text-align:left}
#np.on{display:block}
#npJudul{font-size:1.05rem;line-height:1.3}
#ctl{display:flex;gap:.3rem;align-items:center;margin:.3rem 0 .2rem}
#ctl button{font:inherit;font-size:1.05rem;border:0;background:transparent;color:var(--ink);cursor:pointer;padding:.2rem .5rem}
#ctl #play{width:2.4rem;height:2.4rem;border-radius:50%;border:1.5px solid var(--ink);background:var(--cream);padding:0}
#seek{width:100%;accent-color:#D6336C}
.foto{display:flex;gap:clamp(.8rem,4vw,5rem);flex-wrap:wrap;justify-content:center}
.fw{filter:drop-shadow(0 0 8px var(--pink)) drop-shadow(0 0 14px var(--pink))}
.fr{width:clamp(110px,16vw,210px);aspect-ratio:3/4;background:linear-gradient(#BFE7FF 55%,#9BC53D 55%);overflow:hidden}
.fr img{width:100%;height:100%;object-fit:cover;display:block}
.cloud{clip-path:url(#cloud)}
.arch{clip-path:url(#arch)}
.lists{display:flex;gap:1.2rem;width:min(100%,56rem);justify-content:center}
.lists ol{list-style:none;margin:0;padding:0;flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:.8rem}
.lists button{font:inherit;font-size:clamp(.9rem,2vw,1.15rem);width:100%;padding:.8rem 1rem;border:0;border-radius:28px;background:var(--cream);color:var(--ink);box-shadow:5px 6px 10px rgba(60,40,70,.3);cursor:pointer}
.lists button[aria-pressed="true"]{outline:3px solid var(--pink);outline-offset:-3px;font-weight:600}
@media (max-width:700px){
 #np{left:4vw;width:min(62vw,16rem);min-width:0}
 .s2,.s3,.s4{padding-top:8.5rem}
 .foto{display:grid;grid-template-columns:1fr 1fr}
 .fr{width:min(38vw,170px);margin:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<main>
 <section class="screen s1 on" data-s="1">

 </section>

  </div>
  <button class="btn next" type="button">Next</button>
 </section>

 <section class="screen s4" data-s="4">
  <div class="lists"><ol id="listA"></ol><ol id="listB"></ol></div>
  <button class="btn" id="selesai" type="button">Finish</button>
 </section>
</main>

<script>
/* ====== EDIT BAGIAN INI ====== */
var LAGU=[
 {judul:"love - wave to earth",src:"wave to earth - love.mp3"},
 {judul:"honeybee - Olivia Rodrigo",src:"lagu/2.mp3"},
 {judul:"u + me = < 3 - Olivia Rodrigo",src:"lagu/3.mp3"},
 {judul:"Nina - .Feast",src:"lagu/4.mp3"},
 {judul:"Silence - TXT",src:"lagu/5.mp3"},
 {judul:"We’ll Never Change - TXT",src:"lagu/6.mp3"}
];
/* ============================= */
(function(){
 var $=function(i){return document.getElementById(i)};
 var audio=new Audio(),idx=0,mulai=false,n=LAGU.length,half=Math.ceil(n/2);
 function buatList(el,from,to){
  LAGU.slice(from,to).forEach(function(l,k){
   var i=from+k,li=document.createElement("li"),b=document.createElement("button");
   b.type="button";b.setAttribute("aria-pressed","false");b.dataset.i=i;b.textContent=l.judul;
   b.addEventListener("click",function(){putar(i)});
   li.appendChild(b);el.appendChild(li);
  });
 }
 buatList($("listA"),0,half);buatList($("listB"),half,n);
 function ui(){
  $("npJudul").textContent=LAGU[idx].judul;
  $("play").innerHTML=audio.paused?"&#9654;":"&#10074;&#10074;";
  document.querySelectorAll(".lists button").forEach(function(b){b.setAttribute("aria-pressed",String(+b.dataset.i===idx))});
 }
 function putar(i){
  idx=(i+n)%n;mulai=true;audio.src=LAGU[idx].src;
  var p=audio.play();if(p&&p.catch)p.catch(function(){});
  ui();
 }
 audio.addEventListener("ended",function(){putar(idx+1)});
 audio.addEventListener("play",ui);audio.addEventListener("pause",ui);
 audio.addEventListener("error",function(){$("npJudul").textContent=LAGU[idx].judul+" (file lagu belum ada)"});
 audio.addEventListener("timeupdate",function(){if(audio.duration){$("seek").max=audio.duration;$("seek").value=audio.currentTime}});
 $("seek").addEventListener("input",function(){audio.currentTime=+this.value});
 $("prev").addEventListener("click",function(){putar(idx-1)});
 $("next").addEventListener("click",function(){putar(idx+1)});
 $("play").addEventListener("click",function(){
  if(!mulai){putar(idx);return}
  if(audio.paused){audio.play().catch(function(){})}else{audio.pause()}
 });
 var cur=1;
 function go(k){
  cur=k;
  document.querySelectorAll(".screen").forEach(function(s){s.classList.toggle("on",+s.dataset.s===k)});
  $("np").classList.toggle("on",k>1);
  scrollTo(0,0);
 }
 $("buka").addEventListener("click",function(){putar(0);go(2)});
 document.querySelectorAll(".next").forEach(function(b){b.addEventListener("click",function(){go(cur+1)})});
 $("selesai").addEventListener("click",function(){audio.pause();audio.currentTime=0;mulai=false;go(1)});
 ui();
})();
</script>
